<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="25%" r="55%">
      <stop offset="0" stop-color="#ff3eb8" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ff3eb8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="20%" r="50%">
      <stop offset="0" stop-color="#ffd24a" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#ffd24a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="70%" cy="82%" r="55%">
      <stop offset="0" stop-color="#b347ff" stop-opacity="0.36"/>
      <stop offset="0.6" stop-color="#b347ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow4" cx="18%" cy="80%" r="48%">
      <stop offset="0" stop-color="#3bf0e0" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#3bf0e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3eb8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff3eb8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3eb8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0410"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <rect width="1200" height="630" fill="url(#glow3)"/>
  <rect width="1200" height="630" fill="url(#glow4)"/>

  <!-- Top/bottom accent stripes -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#stripe)"/>
  <rect x="0" y="627" width="1200" height="3" fill="url(#stripe)"/>

  <!-- Grid lines subtle -->
  <g opacity="0.06" stroke="#ff3eb8" stroke-width="1" fill="none">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Corner brackets -->
  <g stroke="#ff3eb8" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="60,40 40,40 40,60"/>
    <polyline points="1140,40 1160,40 1160,60"/>
    <polyline points="60,590 40,590 40,570"/>
    <polyline points="1140,590 1160,590 1160,570"/>
  </g>

  <!-- Tag label -->
  <rect x="80" y="68" width="180" height="30" rx="4" fill="#ff3eb8" fill-opacity="0.18"/>
  <text x="93" y="88" font-family="'Courier New', monospace" font-size="13" fill="#ff3eb8" font-weight="700" letter-spacing="2">// CONSPIRACY</text>

  <!-- Main title - line 1 -->
  <text x="80" y="195" font-family="'Arial Black', 'Impact', sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1">THEY'RE NOT WRONG:</text>

  <!-- Main title - line 2 -->
  <text x="80" y="265" font-family="'Arial Black', 'Impact', sans-serif" font-size="44" font-weight="900" fill="#ff3eb8" filter="url(#blur-glow)">Why the GTA6 Conspiracy Theories</text>

  <!-- Main title - line 3 -->
  <text x="80" y="325" font-family="'Arial Black', 'Impact', sans-serif" font-size="44" font-weight="900" fill="#ff3eb8">Are Hitting Closer Than</text>

  <!-- Main title - line 4 -->
  <text x="80" y="385" font-family="'Arial Black', 'Impact', sans-serif" font-size="44" font-weight="900" fill="#ff3eb8">Rockstar Would Like</text>

  <!-- Divider line -->
  <rect x="80" y="415" width="560" height="2" fill="#ff3eb8" opacity="0.5"/>

  <!-- Subtitle / excerpt -->
  <text x="80" y="453" font-family="'Arial', sans-serif" font-size="22" fill="#ccbbdd" letter-spacing="0.3">DEI mechanics, feminist fingerprints,</text>
  <text x="80" y="481" font-family="'Arial', sans-serif" font-size="22" fill="#ccbbdd" letter-spacing="0.3">and a radio that's laughing at you.</text>

  <!-- Brand -->
  <text x="80" y="560" font-family="'Courier New', monospace" font-size="18" fill="#ffd24a" font-weight="700" letter-spacing="3">LUCIDROB.COM</text>

  <!-- Decorative GTA-esque element - controller icon outline -->
  <g transform="translate(920, 220)" opacity="0.15" fill="none" stroke="#ff3eb8" stroke-width="2">
    <ellipse cx="120" cy="120" rx="110" ry="90"/>
    <circle cx="120" cy="120" r="60" stroke-dasharray="8 6"/>
    <circle cx="120" cy="120" r="30"/>
    <circle cx="120" cy="120" r="8" fill="#ff3eb8" opacity="0.3"/>
  </g>

  <!-- Neon accent dots -->
  <circle cx="1100" cy="80" r="4" fill="#ff3eb8" opacity="0.8"/>
  <circle cx="1120" cy="80" r="4" fill="#ffd24a" opacity="0.8"/>
  <circle cx="1140" cy="80" r="4" fill="#b347ff" opacity="0.8"/>
</svg>
