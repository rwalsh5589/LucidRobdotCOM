<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Lucid Rob Official Merch — shop at lucidrobmerch.com">
  <defs>
    <pattern id="sl" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" fill="#ffffff" opacity="0.022"/>
    </pattern>
    <pattern id="dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7b2cbf" opacity="0.18"/>
    </pattern>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a0a28" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0410" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow-md">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tee-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe48a"/>
      <stop offset="100%" stop-color="#ffb400"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#sl)"/>

  <!-- Outer border + corner notches -->
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#ff006e" stroke-width="1.5" opacity="0.45"/>
  <path d="M0,40 L40,0" stroke="#ff006e" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M1160,0 L1200,40" stroke="#ff006e" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M0,590 L40,630" stroke="#ff006e" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M1160,630 L1200,590" stroke="#ff006e" stroke-width="2.5" fill="none" opacity="0.9"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#ff006e" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="570" x2="1200" y2="570" stroke="#ff006e" stroke-width="0.5" opacity="0.2"/>

  <!-- Background eye motif (subtle) -->
  <g opacity="0.08" stroke="#ff006e" fill="none">
    <polygon points="600,80 950,540 250,540" stroke-width="2.5"/>
    <ellipse cx="600" cy="365" rx="120" ry="70" fill="#ff006e" opacity="0.35"/>
    <circle cx="600" cy="365" r="38" fill="#0a0410"/>
    <circle cx="600" cy="365" r="14" fill="#ff006e"/>
  </g>

  <!-- Eyebrow + headline -->
  <g font-family="'Courier New', monospace">
    <text x="600" y="120" text-anchor="middle" font-size="22" letter-spacing="6" fill="#ffd24a" filter="url(#glow-md)">// OFFICIAL DROPS · NO RESTOCKS</text>
  </g>

  <!-- MERCH headline (layered like the game title) -->
  <g font-family="'Courier New', monospace" font-weight="900">
    <!-- Outer cyan offset -->
    <text x="612" y="220" text-anchor="middle" font-size="148" letter-spacing="14" fill="#00f0ff" opacity="0.85">MERCH</text>
    <!-- Mid gold offset -->
    <text x="606" y="214" text-anchor="middle" font-size="148" letter-spacing="14" fill="#ffd24a" opacity="0.95">MERCH</text>
    <!-- Top magenta -->
    <text x="600" y="208" text-anchor="middle" font-size="148" letter-spacing="14" fill="#ff006e" filter="url(#glow-lg)">MERCH</text>
  </g>

  <!-- T-shirt silhouette, centered -->
  <g transform="translate(440, 270)">
    <!-- Tee body -->
    <path d="M40,40 L80,0 L120,30 Q160,55 200,30 L240,0 L280,40 L320,90 L260,140 L260,360 L60,360 L60,140 L0,90 Z"
          fill="url(#tee-grad)" stroke="#0a0410" stroke-width="6" stroke-linejoin="round"/>
    <!-- Collar -->
    <path d="M120,30 Q160,75 200,30" fill="#0a0410" opacity="0.55"/>
    <!-- Stamp on tee -->
    <g font-family="'Courier New', monospace" font-weight="900" text-anchor="middle">
      <text x="160" y="200" font-size="46" fill="#0a0410" letter-spacing="2">LUCID</text>
      <text x="160" y="248" font-size="46" fill="#ff006e" letter-spacing="2">ROB</text>
      <line x1="60" y1="270" x2="260" y2="270" stroke="#0a0410" stroke-width="2.5"/>
      <text x="160" y="304" font-size="18" fill="#0a0410" letter-spacing="6">// SIGNAL FROM THE STATIC</text>
    </g>
    <!-- Subtle paint-roll texture on the tee -->
    <rect x="0" y="90" width="320" height="2" fill="#0a0410" opacity="0.08"/>
    <rect x="0" y="220" width="320" height="2" fill="#0a0410" opacity="0.06"/>
  </g>

  <!-- Floating accent: lightning bolt left -->
  <g transform="translate(120, 300)" fill="#ffd24a" stroke="#0a0410" stroke-width="3" stroke-linejoin="round">
    <polygon points="20,0 0,40 18,40 6,80 38,30 18,30 30,0"/>
  </g>

  <!-- Floating accent: star burst right -->
  <g transform="translate(1010, 290)" fill="#00f0ff" stroke="#0a0410" stroke-width="3" stroke-linejoin="round">
    <polygon points="40,0 50,30 80,40 50,50 40,80 30,50 0,40 30,30"/>
  </g>

  <!-- Floating accent: small sticker top-right -->
  <g transform="translate(940, 100) rotate(8)">
    <rect x="0" y="0" width="160" height="58" fill="#ff006e" stroke="#0a0410" stroke-width="3"/>
    <text x="80" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="22" fill="#fff4d0" letter-spacing="3">NEW DROP</text>
  </g>

  <!-- CTA bar bottom -->
  <g transform="translate(0, 540)">
    <rect x="0" y="0" width="1200" height="60" fill="#ffd24a"/>
    <rect x="0" y="58" width="1200" height="2" fill="#0a0410"/>
    <text x="600" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="26" fill="#0a0410" letter-spacing="6">SHOP NOW · LUCIDROBMERCH.COM →</text>
  </g>
</svg>
