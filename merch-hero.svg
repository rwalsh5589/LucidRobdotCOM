<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Lucid Rob Official Merch — shop at lucidrobmerch.com">
  <defs>
    <pattern id="sl" x="0" y="0" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="1" fill="#ffffff" opacity="0.022"/>
    </pattern>
    <pattern id="dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7b2cbf" opacity="0.18"/>
    </pattern>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1a0a28"/>
      <stop offset="100%" stop-color="#0a0410"/>
    </radialGradient>
    <filter id="glow-md">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" fill="url(#bg-glow)"/>
  <rect width="1200" height="260" fill="url(#dots)"/>
  <rect width="1200" height="260" fill="url(#sl)"/>

  <!-- Outer border + corner notches -->
  <rect x="1" y="1" width="1198" height="258" fill="none" stroke="#ff006e" stroke-width="1.5" opacity="0.45"/>
  <path d="M0,30 L30,0" stroke="#ff006e" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M1170,0 L1200,30" stroke="#ff006e" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M0,230 L30,260" stroke="#ff006e" stroke-width="2.5" fill="none" opacity="0.9"/>
  <path d="M1170,260 L1200,230" stroke="#ff006e" stroke-width="2.5" fill="none" opacity="0.9"/>
  <line x1="0" y1="50" x2="1200" y2="50" stroke="#ff006e" stroke-width="0.5" opacity="0.2"/>
  <line x1="0" y1="195" x2="1200" y2="195" stroke="#ff006e" stroke-width="0.5" opacity="0.2"/>

  <!-- Eyebrow -->
  <text x="600" y="42" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" letter-spacing="6" fill="#ffd24a" filter="url(#glow-md)">// OFFICIAL DROPS · NO RESTOCKS</text>

  <!-- MERCH headline (layered cyan / gold / magenta offsets) -->
  <g font-family="'Courier New', monospace" font-weight="900">
    <text x="612" y="170" text-anchor="middle" font-size="120" letter-spacing="12" fill="#00f0ff" opacity="0.85">MERCH</text>
    <text x="606" y="164" text-anchor="middle" font-size="120" letter-spacing="12" fill="#ffd24a" opacity="0.95">MERCH</text>
    <text x="600" y="158" text-anchor="middle" font-size="120" letter-spacing="12" fill="#ff006e" filter="url(#glow-lg)">MERCH</text>
  </g>

  <!-- CTA bar bottom -->
  <g transform="translate(0, 200)">
    <rect x="0" y="0" width="1200" height="60" fill="#ffd24a"/>
    <rect x="0" y="58" width="1200" height="2" fill="#0a0410"/>
    <text x="600" y="40" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="26" fill="#0a0410" letter-spacing="6">SHOP NOW · LUCIDROBMERCH.COM →</text>
  </g>
</svg>
